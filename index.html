<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>My Live Page</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      min-height: 100vh; display: flex;
      align-items: center; justify-content: center;
      background: linear-gradient(135deg, #0d1117, #161b22, #0d1117);
      color: #e6edf3; text-align: center; padding: 2rem;
    }
    .card {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 20px; padding: 3rem 3.5rem;
      max-width: 560px; backdrop-filter: blur(16px);
      animation: up 0.6s cubic-bezier(0.16,1,0.3,1) both;
    }
    @keyframes up { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:translateY(0); } }
    .octo { font-size: 4rem; margin-bottom: 1rem; display: block; animation: spin 8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    h1 {
      font-size: 2.4rem; font-weight: 900; margin-bottom: 0.8rem;
      background: linear-gradient(90deg, #58a6ff, #bc8cff, #3fb950);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-size: 200%; animation: g 4s ease infinite;
    }
    @keyframes g { 0%,100%{background-position:0%} 50%{background-position:100%} }
    p { opacity: 0.65; line-height: 1.7; margin-bottom: 2rem; }
    a {
      display: inline-block; padding: 0.8rem 2rem; border-radius: 50px;
      background: linear-gradient(135deg, #58a6ff, #bc8cff);
      color: #fff; font-weight: 700; text-decoration: none;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    a:hover { transform: translateY(-2px); box-shadow: 0 10px 28px rgba(88,166,255,0.45); }
  </style>
</head>
<body>
  <div class="card">
    <span class="octo">🐙</span>
    <h1>Hello GitHub Pages!</h1>
    <p>This page is deployed free via <strong>GitHub Pages</strong>.
       Edit the HTML and click deploy to update it live.</p>
    <a href="https://github.com/abdelrahmanmansoureid-oss" target="_blank">View My GitHub →</a>
  </div>
</body>
</html>
